server:
  port: 8080

# 自定義路徑 (警告可忽略或在插件中選 Ignore)
app:
  file:
    upload-path: D:/SeatRentSysNew/images/

spring:
  application:
    name: seat-rent-backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SeatRentSys;encrypt=false;trustServerCertificate=true
    username: tippy
    password: 1234
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

    # ✅ 修正：確保 properties 與上面的 hibernate、show-sql 完全對齊
    # 採用最穩定的中括號寫法，消除語法警告
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.default_schema]": dbo
      "[hibernate.dialect]": org.hibernate.dialect.SQLServerDialect
      "[hibernate.jdbc.lob.non_contextual_creation]": true
