server:
  port: 8080

spring:
  application:
    name: seat-rent-backend

  datasource:
    # 使用你的連線字串與帳號 tippy
    url: jdbc:sqlserver://localhost:1433;databaseName=SeatRentSys;encrypt=false;trustServerCertificate=true
    username: tippy
    password: 1234
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      # ✅ 修正：naming 必須縮排在 hibernate 之下，設定才會生效
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.SQLServerDialect
        "[default_schema]": dbo
