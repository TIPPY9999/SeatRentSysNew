server:
  port: 8080

spring:
  application:
    name: seat-rent-backend

  datasource:
    # 👇 連線字串
    url: jdbc:sqlserver://localhost:1433;databaseName=SeatRentSys;encrypt=false;trustServerCertificate=true
    # 👇 你的帳號 (保留 tippy 讓你連線)
    username: tippy
    # 👇 你的密碼
    password: 1234
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    show-sql: true
    hibernate:
      # 👇 照你要求的：手動建表，不讓程式亂動資料庫
      ddl-auto: none

    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.SQLServerDialect
        "[default_schema]": dbo
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
