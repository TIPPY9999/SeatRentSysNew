server:
  port: 8080

spring:
  application:
    name: seat-rent-backend

  datasource:
    # 👇 這裡要改：填入你的資料庫名稱 (例如 SeatDB)
    url: jdbc:sqlserver://localhost:1433;databaseName=SeatRentSys;encrypt=false;trustServerCertificate=true
    # 👇 這裡要改：你的 SQL Server 帳號 (通常是 sa)
    username: tippy
    # 👇 這裡要改：你的 SQL Server 密碼
    password: 1234
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.SQLServerDialect
        "[default_schema]": dbo
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
