spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RentalSystemDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=tom
spring.datasource.password=654832
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 可選：先讓 Hibernate 不要亂建表（你們資料表已存在通常用 validate）
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# [關鍵修正] 告訴 Hibernate 不要把駝峰命名 (RentalSpot) 轉成蛇形命名 (rental_spot)，而是直接用類別名稱當作資料表名稱
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8081

# View Resolver 設定 (若使用 JSP)
# 既然前端已經完全交給 Vue 處理，後端不再需要設定 JSP 的視圖解析器（View Resolver）。
# spring.mvc.view.prefix=/WEB-INF/view/
# spring.mvc.view.suffix=.jsp
